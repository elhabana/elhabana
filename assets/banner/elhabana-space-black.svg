<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">elhabana</title>
  <desc id="desc">A modular graphite sculpture with subtle silver and blue lighting beside the elhabana wordmark.</desc>
  <defs>
    <radialGradient id="ambient" cx="76%" cy="48%" r="58%"><stop stop-color="#272E41" stop-opacity=".6"/><stop offset="1" stop-color="#08090C" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="-110" y1="-70" x2="100" y2="25" gradientUnits="userSpaceOnUse"><stop stop-color="#929AA9"/><stop offset=".45" stop-color="#454D5C"/><stop offset="1" stop-color="#202631"/></linearGradient>
    <linearGradient id="left" x1="-106" y1="0" x2="0" y2="126" gradientUnits="userSpaceOnUse"><stop stop-color="#353D4A"/><stop offset="1" stop-color="#0E1118"/></linearGradient>
    <linearGradient id="right" x1="0" y1="40" x2="106" y2="115" gradientUnits="userSpaceOnUse"><stop stop-color="#232A38"/><stop offset="1" stop-color="#0B0E15"/></linearGradient>
    <linearGradient id="edge" x1="-106" y1="-60" x2="90" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#CCD2DF" stop-opacity=".8"/><stop offset="1" stop-color="#535F7B" stop-opacity=".12"/></linearGradient>
    <radialGradient id="floor"><stop stop-color="#68748D" stop-opacity=".18"/><stop offset="1" stop-color="#68748D" stop-opacity="0"/></radialGradient>
    <g id="module" stroke-linejoin="round">
      <path d="M0-61 106 0 0 61-106 0Z" fill="url(#top)" stroke="url(#edge)"/>
      <path d="M-106 0 0 61V126L-106 65Z" fill="url(#left)" stroke="#454F62" stroke-opacity=".35"/>
      <path d="M0 61 106 0V65L0 126Z" fill="url(#right)" stroke="#454F62" stroke-opacity=".3"/>
      <path d="m-106 0 106 61L106 0" stroke="url(#edge)"/>
    </g>
  </defs>
  <rect width="1200" height="480" rx="20" fill="#08090C"/>
  <rect width="1200" height="480" rx="20" fill="url(#ambient)"/>
  <rect x=".5" y=".5" width="1199" height="479" rx="19.5" stroke="#30343D" stroke-opacity=".65"/>
  <ellipse cx="883" cy="411" rx="235" ry="36" fill="url(#floor)"/>
  <g transform="translate(879 259)"><use href="#module"/></g>
  <g transform="translate(879 181)"><use href="#module"/></g>
  <g transform="translate(879 103)"><use href="#module"/></g>
  <path d="M74 119H117" stroke="#969FBD" stroke-width="2"/>
  <text x="70" y="257" fill="#F3F4F7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="98" font-weight="600" letter-spacing="-5">elhabana</text>
  <text x="76" y="306" fill="#ADB3BE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" letter-spacing="2">GAMES / SYSTEMS / VISUALS</text>
</svg>
