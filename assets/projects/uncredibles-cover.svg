<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">UN-CREDIBLES — in development</title>
  <desc id="desc">Typographic project cover for a multiplayer superhero party game. Four subtle spotlights represent up to four players. This is not a gameplay screenshot.</desc>
  <defs>
    <radialGradient id="light"><stop stop-color="#8994B2" stop-opacity=".16"/><stop offset="1" stop-color="#8994B2" stop-opacity="0"/></radialGradient>
    <linearGradient id="silver" x1="140" y1="162" x2="960" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DCE0E8"/><stop offset="1" stop-color="#9DA6B7"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#0A0B0F"/>
  <ellipse cx="200" cy="400" rx="210" ry="290" fill="url(#light)"/>
  <ellipse cx="465" cy="400" rx="210" ry="290" fill="url(#light)"/>
  <ellipse cx="735" cy="400" rx="210" ry="290" fill="url(#light)"/>
  <ellipse cx="1000" cy="400" rx="210" ry="290" fill="url(#light)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" stroke="#30343D" stroke-opacity=".7"/>
  <circle cx="78" cy="67" r="4" fill="#A6AEC1"/>
  <text x="95" y="75" fill="#ADB3BE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="2">IN DEVELOPMENT</text>
  <text x="600" y="233" text-anchor="middle" fill="url(#silver)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="103" font-weight="700" letter-spacing="-3">UN-CREDIBLES</text>
  <text x="600" y="287" text-anchor="middle" fill="#B4BBC9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" letter-spacing="1">A multiplayer superhero party game.</text>
  <g fill="#929DB6">
    <rect x="558" y="353" width="12" height="3" rx="1.5"/><rect x="582" y="353" width="12" height="3" rx="1.5"/>
    <rect x="606" y="353" width="12" height="3" rx="1.5"/><rect x="630" y="353" width="12" height="3" rx="1.5"/>
  </g>
</svg>
